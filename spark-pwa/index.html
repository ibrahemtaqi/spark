<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Spark"/>
  <meta name="theme-color" content="#080610"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <title>Spark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&display=swap"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #080610; color: #f5f0ff; }
    body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; min-height: -webkit-fill-available; }
    input, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #080610; }
    ::-webkit-scrollbar-thumb { background: #3b2f6e; border-radius: 99px; }
    body::after {
      content:''; position:fixed; inset:0; z-index:9999; pointer-events:none; opacity:.025;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:180px;
    }

    /* ── AUTH / SETUP OVERLAY ── */
    #overlay {
      position:fixed; inset:0; z-index:9998;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:32px 24px; font-family:'Bricolage Grotesque',sans-serif;
      background:#080610;
    }
    #overlay.gone { display:none; }
    #overlay-bg {
      position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(ellipse 80% 60% at 50% 100%, #1d0d42 0%, #0d0820 50%, #080610 80%);
    }
    .ov-logo { font-family:'Instrument Serif',serif; font-style:italic; font-size:38px; color:#f5f0ff; margin-bottom:6px; position:relative; z-index:1; text-shadow:0 0 60px rgba(124,58,237,.4); }
    .ov-sub  { color:#6b6585; font-size:12px; margin-bottom:28px; letter-spacing:.5px; position:relative; z-index:1; }
    .ov-card {
      background:#0f0d1a; border:1px solid #1e1a30; border-radius:20px;
      padding:28px 24px; max-width:400px; width:100%; position:relative; z-index:1;
    }
    .ov-card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,#7c3aed,transparent); border-radius:20px 20px 0 0; }
    .ov-tabs { display:flex; gap:0; margin-bottom:24px; background:#080610; border-radius:10px; padding:3px; }
    .ov-tab  { flex:1; padding:9px 0; background:transparent; border:none; color:#6b6585; font-size:12px; font-weight:700; cursor:pointer; border-radius:8px; transition:all .15s; letter-spacing:.5px; }
    .ov-tab.active { background:#1e1a30; color:#f5f0ff; }
    .ov-lbl  { font-size:9px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#6b6585; margin-bottom:7px; display:block; }
    .ov-inp  { width:100%; background:#080610; border:1px solid #1e1a30; border-radius:10px; padding:12px 14px; color:#f5f0ff; font-size:13px; outline:none; letter-spacing:.3px; transition:border-color .2s; margin-bottom:12px; }
    .ov-inp:focus { border-color:#7c3aed; }
    .ov-btn  { width:100%; padding:14px 0; background:transparent; border:1.5px solid #a78bfa; border-radius:12px; color:#a78bfa; font-size:14px; font-weight:700; cursor:pointer; transition:all .2s; margin-top:4px; }
    .ov-btn:hover { background:#a78bfa; color:#080610; }
    .ov-btn:disabled { opacity:.4; cursor:not-allowed; }
    .ov-err  { color:#f87171; font-size:11px; margin-top:8px; text-align:center; min-height:16px; }
    .ov-ok   { color:#86efac; font-size:11px; margin-top:8px; text-align:center; min-height:16px; }
    .ov-divider { display:flex; align-items:center; gap:10px; margin:16px 0; }
    .ov-divider::before, .ov-divider::after { content:''; flex:1; height:1px; background:#1e1a30; }
    .ov-divider span { font-size:10px; color:#6b6585; }
    .ov-note { font-size:11px; color:#6b6585; text-align:center; margin-top:16px; line-height:1.6; position:relative; z-index:1; }

    /* Gemini key screen */
    .ov-step { display:flex; gap:12px; margin-bottom:16px; align-items:flex-start; }
    .ov-num  { background:#3b2f6e; color:#a78bfa; width:22px; height:22px; border-radius:99px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; flex-shrink:0; margin-top:1px; }
    .ov-stxt { font-size:12px; color:#9d97b8; line-height:1.6; }
    .ov-stxt a { color:#a78bfa; text-decoration:none; }
    .ov-stxt strong { color:#f5f0ff; }

    /* Install banner */
    #banner { display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:9997; background:#1a1630; border:1px solid #3b2f6e; border-radius:16px; padding:14px 18px; gap:14px; box-shadow:0 8px 32px rgba(124,58,237,.3); max-width:340px; width:calc(100% - 40px); font-family:'Bricolage Grotesque',sans-serif; align-items:center; }
    #banner.show { display:flex; }
    #banner strong { display:block; color:#f5f0ff; font-size:12px; margin-bottom:2px; }
    #banner span { color:#6b6585; font-size:10px; }
    #ibtn { background:#7c3aed; border:none; color:white; padding:8px 14px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
    #dbtn { background:transparent; border:none; color:#6b6585; font-size:18px; cursor:pointer; }
  </style>
</head>
<body>

  <!-- ── OVERLAY (Auth + Gemini Key) ── -->
  <div id="overlay">
    <div id="overlay-bg"></div>
    <div class="ov-logo">spark</div>
    <div class="ov-sub" id="ov-sub">sign in to save your ideas forever</div>
    <div class="ov-card" id="ov-card"><!-- filled by JS --></div>
    <div class="ov-note" id="ov-note"></div>
  </div>

  <div id="root"></div>

  <div id="banner">
    <div><strong>✦ Add Spark to home screen</strong><span>Works like a real app</span></div>
    <button id="ibtn">Install</button>
    <button id="dbtn">×</button>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    /* ── SUPABASE INIT ── */
    const SURL = 'https://dhoaixunvkbvpabxsfqd.supabase.co';
    const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRob2FpeHVudmtidnBhYnhzZnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODYyMDEsImV4cCI6MjA5NjU2MjIwMX0.xB2sQKng2sSJ1FKVAxDz9HkXzfwE0QFfoJroC6cnj6c';
    const sb = supabase.createClient(SURL, SKEY);

    const GKEY_LS = 'spark_gemini_key';
    const overlay = document.getElementById('overlay');
    const ovCard  = document.getElementById('ov-card');
    const ovSub   = document.getElementById('ov-sub');
    const ovNote  = document.getElementById('ov-note');

    let currentUser = null;

    /* ── OVERLAY SCREENS ── */
    function showAuthScreen(mode = 'signin') {
      ovSub.textContent = mode === 'signin' ? 'sign in to save your ideas forever' : 'create your free account';
      ovNote.textContent = '🔒 Your data is stored securely in the cloud.';
      ovCard.innerHTML = `
        <div class="ov-tabs">
          <button class="ov-tab ${mode==='signin'?'active':''}" onclick="showAuthScreen('signin')">sign in</button>
          <button class="ov-tab ${mode==='signup'?'active':''}" onclick="showAuthScreen('signup')">sign up</button>
        </div>
        ${mode==='signup'?`<label class="ov-lbl">your name</label><input class="ov-inp" id="auth-name" type="text" placeholder="ibrahim" autocomplete="name"/>` : ''}
        <label class="ov-lbl">email</label>
        <input class="ov-inp" id="auth-email" type="email" placeholder="you@email.com" autocomplete="email"/>
        <label class="ov-lbl">password</label>
        <input class="ov-inp" id="auth-pass" type="password" placeholder="••••••••" autocomplete="${mode==='signin'?'current-password':'new-password'}"/>
        <button class="ov-btn" id="auth-btn">${mode==='signin'?'sign in →':'create account →'}</button>
        <div class="ov-err" id="auth-err"></div>
      `;
      document.getElementById('auth-btn').onclick = () => handleAuth(mode);
      document.getElementById('auth-pass').addEventListener('keydown', e => e.key==='Enter' && handleAuth(mode));
    }

    async function handleAuth(mode) {
      const email = document.getElementById('auth-email').value.trim();
      const pass  = document.getElementById('auth-pass').value;
      const name  = mode==='signup' ? (document.getElementById('auth-name')?.value.trim()||'ibrahim') : '';
      const err   = document.getElementById('auth-err');
      const btn   = document.getElementById('auth-btn');

      if (!email || !pass) { err.textContent = 'fill in both fields'; return; }
      if (pass.length < 6) { err.textContent = 'password needs at least 6 characters'; return; }

      btn.textContent = '…'; btn.disabled = true; err.textContent = '';

      try {
        let result;
        if (mode === 'signin') {
          result = await sb.auth.signInWithPassword({ email, password: pass });
        } else {
          result = await sb.auth.signUp({ email, password: pass, options: { data: { name } } });
        }
        if (result.error) throw result.error;
        if (mode === 'signup' && !result.data.session) {
          // Email confirmation needed
          ovCard.innerHTML = `<div style="text-align:center;padding:20px 0;">
            <div style="font-size:32px;margin-bottom:12px;">📬</div>
            <div style="font-family:'Instrument Serif',serif;font-style:italic;font-size:20px;color:#f5f0ff;margin-bottom:10px;">check your email</div>
            <div style="font-size:13px;color:#9d97b8;line-height:1.7;">We sent a confirmation link to <strong style="color:#f5f0ff;">${email}</strong>.<br/>Click it then come back and sign in.</div>
            <button class="ov-btn" style="margin-top:20px;" onclick="showAuthScreen('signin')">back to sign in</button>
          </div>`;
          return;
        }
        currentUser = result.data.user;
        showGeminiScreen();
      } catch(e) {
        err.textContent = e.message || 'something went wrong — try again';
        btn.textContent = mode==='signin'?'sign in →':'create account →';
        btn.disabled = false;
      }
    }

    function showGeminiScreen() {
      // Key is already baked in — skip setup screen entirely
      const builtInKey = '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';
      localStorage.setItem(GKEY_LS, builtInKey);
      overlay.classList.add('gone');
      window.__sparkUserReady && window.__sparkUserReady(currentUser);
    }

    /* ── BOOT ── */
    async function boot() {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        const hasKey = localStorage.getItem(GKEY_LS);
        if (hasKey) {
          overlay.classList.add('gone');
          window.__sparkUserReady && window.__sparkUserReady(currentUser);
        } else {
          showGeminiScreen();
        }
      } else {
        showAuthScreen('signin');
      }
    }
    boot();

    /* ── INSTALL PROMPT ── */
    let dp = null;
    const banner = document.getElementById('banner');
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; setTimeout(()=>{ if(!localStorage.getItem('spark_idismissed')) banner.classList.add('show'); },4000); });
    document.getElementById('ibtn').onclick = async()=>{ if(!dp)return; dp.prompt(); await dp.userChoice; dp=null; banner.classList.remove('show'); };
    document.getElementById('dbtn').onclick = ()=>{ banner.classList.remove('show'); localStorage.setItem('spark_idismissed','1'); };
    if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
    const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
    if(isIOS&&!window.navigator.standalone&&!localStorage.getItem('spark_ios')){
      setTimeout(()=>{
        localStorage.setItem('spark_ios','1');
        const m=document.createElement('div');
        m.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1630;border:1px solid #3b2f6e;border-radius:16px;padding:14px 18px;z-index:9996;max-width:320px;width:calc(100% - 40px);font-family:"Bricolage Grotesque",sans-serif;font-size:12px;color:#c4b5fd;text-align:center;line-height:1.6;box-shadow:0 8px 32px rgba(124,58,237,.3)';
        m.innerHTML='<strong style="color:#f5f0ff;display:block;margin-bottom:4px">✦ Add Spark to home screen</strong>Tap <strong>Share</strong> → <strong>"Add to Home Screen"</strong><br><button onclick="this.parentElement.remove()" style="margin-top:10px;background:transparent;border:1px solid #3b2f6e;color:#6b6585;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:11px">got it</button>';
        document.body.appendChild(m); setTimeout(()=>m.remove(),12000);
      },4000);
    }
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef } = React;

    /* ── SUPABASE DB HELPERS ── */
    const DB = {
      async getLiked(userId) {
        const { data } = await sb.from('saved_ideas').select('*').eq('user_id', userId).order('saved_at', { ascending: false });
        return data || [];
      },
      async getSkipped(userId) {
        const { data } = await sb.from('skipped_ideas').select('*').eq('user_id', userId).order('skipped_at', { ascending: false });
        return data || [];
      },
      async saveLiked(userId, idea) {
        await sb.from('saved_ideas').insert({ user_id: userId, ...idea });
      },
      async saveSkipped(userId, item) {
        await sb.from('skipped_ideas').insert({ user_id: userId, ...item });
      },
      async logMood(userId, mood, pillar) {
        await sb.from('mood_log').insert({ user_id: userId, mood, pillar });
      },
      async deleteLiked(userId, id) {
        await sb.from('saved_ideas').delete().eq('id', id).eq('user_id', userId);
      }
    };

    /* ── OPENROUTER / DEEPSEEK ── */
    async function callGemini(prompt) {
      const key = localStorage.getItem('spark_gemini_key');
      if (!key) { window.location.reload(); return []; }
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`,
          'HTTP-Referer': 'https://ibrahemtaqi.github.io/spark',
          'X-Title': 'Spark Creative Companion',
        },
        body: JSON.stringify({
          model: 'deepseek/deepseek-chat-v3-0324:free',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.9,
          max_tokens: 1400,
        })
      });
      if (res.status===401||res.status===403) { localStorage.removeItem('spark_gemini_key'); window.location.reload(); return []; }
      const json = await res.json();
      const text = json.choices?.[0]?.message?.content || '[]';
      const clean = text.replace(/```json|```/g,'').trim();
      const s = clean.indexOf('['), e = clean.lastIndexOf(']');
      return JSON.parse(clean.slice(s, e+1));
    }

    /* ── TOKENS ── */
    const C = {
      bg:'#080610', bgCard:'#0f0d1a', bgFloat:'#1a1630',
      violet:'#7c3aed', vsoft:'#a78bfa', vdim:'#3b2f6e',
      lavender:'#c4b5fd', peach:'#fb923c', green:'#86efac',
      cyan:'#67e8f9', rose:'#f87171', yellow:'#fbbf24',
      white:'#f5f0ff', muted:'#6b6585', mid:'#9d97b8',
      border:'#1e1a30',
    };

    function getTOD() {
      const h=new Date().getHours();
      if(h>=5&&h<12)  return {id:'morning',  label:'morning',  emoji:'🌅',color:'#fbbf24',greet:'good morning'};
      if(h>=12&&h<17) return {id:'afternoon',label:'afternoon',emoji:'☀️', color:'#fb923c',greet:'good afternoon'};
      if(h>=17&&h<21) return {id:'evening',  label:'evening',  emoji:'🌇',color:'#a78bfa',greet:'good evening'};
      return                 {id:'night',    label:'night',    emoji:'🌙',color:'#67e8f9',greet:'hey night owl'};
    }

    const PILLARS=[
      {id:'all',        label:'everything',  emoji:'✦', color:C.vsoft},
      {id:'craft',      label:'craft',       emoji:'🎬',color:C.rose},
      {id:'marketing',  label:'marketing',   emoji:'📣',color:C.peach},
      {id:'productivity',label:'productivity',emoji:'⚡',color:C.yellow},
      {id:'daily',      label:'daily spark', emoji:'🎲',color:C.green},
    ];
    const MOODS=[
      {id:'restless',label:'restless',  sub:'need to make something rn',   emoji:'⚡',color:C.peach},
      {id:'curious', label:'curious',   sub:'show me something new',       emoji:'🔭',color:C.vsoft},
      {id:'slow',    label:'slow burn', sub:'quiet, no rush',              emoji:'🌿',color:C.green},
      {id:'bold',    label:'bold',      sub:'big swings only',             emoji:'🔥',color:C.rose},
      {id:'lost',    label:'lost',      sub:'just give me a spark',        emoji:'🌫️',color:C.lavender},
      {id:'studying',label:'study mode',sub:'i want to learn craft today', emoji:'📽️',color:C.cyan},
    ];
    const TM={
      'Try This':        {bg:'#fb923c18',color:'#fb923c'},
      'Study This':      {bg:'#86efac18',color:'#86efac'},
      'Steal This':      {bg:'#fbbf2418',color:'#fbbf24'},
      'Think About This':{bg:'#a78bfa18',color:'#a78bfa'},
      'Do This Now':     {bg:'#67e8f918',color:'#67e8f9'},
    };

    /* ── PROMPTS ── */
    function moodPrompt(mood,pillar,liked,skipped){
      const m=MOODS.find(x=>x.id===mood), p=PILLARS.find(x=>x.id===pillar), tod=getTOD();
      const likedStr=liked.slice(-12).map(i=>`"${i.title}" (${i.domain})`).join(', ');
      const skippedStr=skipped.slice(-6).map(i=>i.title).join(', ');
      const focus=pillar==='all'?'Mix freely: Filmmaking, Editing, Storytelling, Copywriting, Design, Photography, Branding, Marketing, Productivity, Daily-Fun.'
        :pillar==='craft'?'Focus: Filmmaking, Editing, Storytelling, Copywriting, Cinematography, Design, Photography, Sound, Writing.'
        :pillar==='marketing'?'Focus: Personal Branding, Content Strategy, Audience Growth, Social Media, Copywriting, Positioning.'
        :pillar==='productivity'?'Focus: Focus Systems, Deep Work, Creative Routines, Mental Clarity, Time Blocking, Energy Management.'
        :`Fun, low-pressure activities for ${tod.label} time.`;
      return `You are the creative mentor inside Spark for Ibrahim — 25, Faisalabad, Pakistan. Building personal brand around growth and authentic storytelling. Learning filmmaking, editing, storytelling, copywriting, design, marketing, productivity. Gen Z, draws from Pakistani and international creative culture.

Mood: "${m?.label}" — "${m?.sub}"
Time: ${tod.label}
Area: ${p?.label}
${focus}

Liked before: ${likedStr||'none yet'}
Skipped: ${skippedStr||'none yet'}

5 creative inspiration cards. Mentor whisper — specific, surprising.
- title: max 9 words, lowercase, no question marks
- domain: Filmmaking|Editing|Storytelling|Copywriting|Cinematography|Design|Photography|Sound|Writing|Branding|Marketing|Productivity|Daily-Fun
- type: "Try This"|"Study This"|"Steal This"|"Think About This"|"Do This Now"
- body: 2-3 sentences. Specific, real technique, Pakistan reference if relevant.
- reference: real person/work
- why: one sentence on mood+time fit

JSON array only. No markdown.
[{"title":"","domain":"","type":"","body":"","reference":"","why":""}]`;
    }

    function searchPrompt(q,liked){
      const tod=getTOD();
      const likedStr=liked.slice(-10).map(i=>`"${i.title}" (${i.domain})`).join(', ');
      return `Creative mentor inside Spark for Ibrahim — 25, Faisalabad. Learning filmmaking, storytelling, copywriting, design, marketing, productivity.

Query: "${q}"
Time: ${tod.label}
Liked: ${likedStr||'none yet'}

4 cards responding to this query. Specific, practical, mentorly.
- title, domain, type, body (2-3 sentences), reference (real), why

JSON array only. No markdown.
[{"title":"","domain":"","type":"","body":"","reference":"","why":""}]`;
    }

    /* ── DECORATIVE ── */
    function Glow({x='50%',y='50%',color='rgba(124,58,237,0.12)',size=300}){
      return <div style={{position:'fixed',left:x,top:y,width:size,height:size,borderRadius:'50%',background:color,filter:'blur(90px)',transform:'translate(-50%,-50%)',pointerEvents:'none',zIndex:0}}/>;
    }
    function BgWords(){
      const words=['story','craft','edit','light','voice','frame','grow','make','focus','brand','cut','feel'];
      return(
        <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:0,overflow:'hidden',userSelect:'none'}}>
          {words.map((w,i)=><span key={i} style={{position:'absolute',left:`${(i*41+5)%88}%`,top:`${(i*27+6)%86}%`,fontFamily:"'Bricolage Grotesque',sans-serif",fontWeight:800,fontSize:`${22+(i%3)*18}px`,color:'#3b2f6e',opacity:.14,transform:`rotate(${(i%5-2)*9}deg)`,letterSpacing:2}}>{w}</span>)}
        </div>
      );
    }
    function Pill({label,bg,color}){
      return <span style={{display:'inline-flex',alignItems:'center',background:bg,color,fontSize:9,fontWeight:700,letterSpacing:1.5,textTransform:'uppercase',padding:'3px 9px',borderRadius:99}}>{label}</span>;
    }

    /* ── TOP NAV ── */
    function Nav({screen,onBack,onHome,onBoard,onSearch,likedCount,userEmail,onSignOut}){
      const [showMenu,setShowMenu]=useState(false);
      return(

    /* ── ROOT APP ── */
    function App(){
      const [user,setUser]     = useState(null);
      const [ready,setReady]   = useState(false);
      const [liked,setLiked]   = useState([]);
      const [skipped,setSkipped]=useState([]);
      const [screen,setScreen] = useState('home');
      const [prev,setPrev]     = useState(null);
      const [mood,setMood]     = useState(null);
      const [pillar,setPillar] = useState('all');
      const [query,setQuery]   = useState(null);
      const [ideas,setIdeas]   = useState([]);
      const [idx,setIdx]       = useState(0);
      const [err,setErr]       = useState(null);

      // Called by vanilla JS once auth+gemini key are confirmed
      useEffect(()=>{
        window.__sparkUserReady = async (u) => {
          setUser(u);
          if(u){
            const [l,s] = await Promise.all([DB.getLiked(u.id), DB.getSkipped(u.id)]);
            setLiked(l); setSkipped(s);
          }
          setReady(true);
        };
        // Check if already booted (page refresh with session)
        sb.auth.getSession().then(({data:{session}})=>{
          if(session?.user && localStorage.getItem('spark_gemini_key')){
            window.__sparkUserReady(session.user);
          }
        });
        return () => { delete window.__sparkUserReady; };
      },[]);

      const goTo=(to)=>{setPrev(screen);setScreen(to);};
      const goBack=()=>{ if(screen==='search'||screen==='board'){setScreen(prev||'home');return;} setScreen('home'); };

      const handleGo=async(m,p)=>{
        setMood(m);setPillar(p);setQuery(null);setScreen('loading');setErr(null);
        try{
          const f=await callGemini(moodPrompt(m,p,liked,skipped));
          if(user) DB.logMood(user.id,m,p);
          setIdeas(f);setIdx(0);setScreen('ideas');
        }catch{setErr("couldn't load — check connection");setScreen('home');}
      };

      const handleResults=(r,q)=>{setQuery(q);setIdeas(r);setIdx(0);setScreen('ideas');};

      const handleLike=async()=>{
        const idea={...ideas[idx]};
        const entry={...idea,mood,pillar,savedAt:new Date().toLocaleDateString()};
        setLiked(prev=>[...prev,entry]);
        if(user) await DB.saveLiked(user.id,{title:idea.title,domain:idea.domain,type:idea.type,body:idea.body,reference:idea.reference,why:idea.why,mood,pillar});
        adv();
      };
      const handleSkip=async()=>{
        const item={title:ideas[idx].title,mood};
        setSkipped(prev=>[...prev,item]);
        if(user) await DB.saveSkipped(user.id,item);
        adv();
      };
      const handleDelete=async(id)=>{
        setLiked(prev=>prev.filter(i=>i.id!==id));
        if(user) await DB.deleteLiked(user.id,id);
      };
      const handleSignOut=async()=>{
        await sb.auth.signOut();
        localStorage.removeItem('spark_gemini_key');
        window.location.reload();
      };
      const adv=()=>{if(idx+1>=ideas.length)setScreen('done');else setIdx(i=>i+1);};

      if(!ready) return(
        <div style={{display:'flex',justifyContent:'center',alignItems:'center',minHeight:'100vh',color:C.muted,fontSize:13,fontFamily:"'Bricolage Grotesque',sans-serif"}}>
          <Glow x="50%" y="50%" color="rgba(124,58,237,0.1)" size={300}/>
        </div>
      );

      return(
        <div style={{minHeight:'100vh',background:C.bg,fontFamily:"'Bricolage Grotesque',sans-serif",color:C.white,position:'relative',overflow:'hidden'}}>
          <Nav screen={screen} onBack={goBack} onHome={()=>setScreen('home')} onBoard={()=>goTo('board')} onSearch={()=>goTo('search')} likedCount={liked.length} userEmail={user?.email} onSignOut={handleSignOut}/>
          {err&&<div style={{background:'#1a0812',borderBottom:'1px solid #3a1028',color:'#f472b6',padding:'9px 20px',fontSize:11}}>{err}</div>}
          {screen==='home'    &&<Home onGo={handleGo} onSearch={()=>goTo('search')} liked={liked}/>}
          {screen==='search'  &&<Search onResults={handleResults} liked={liked}/>}
          {screen==='loading' &&<Loading mood={mood} pillar={pillar} query={query}/>}
          {screen==='ideas'   &&ideas[idx]&&<Card idea={{...ideas[idx],mood}} onLike={handleLike} onSkip={handleSkip} index={idx} total={ideas.length}/>}
          {screen==='board'   &&<Board liked={liked} userId={user?.id} onDelete={handleDelete}/>}
          {screen==='done'    &&<Done onMore={()=>setScreen('home')} onBoard={()=>setScreen('board')} onSearch={()=>setScreen('search')}/>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
